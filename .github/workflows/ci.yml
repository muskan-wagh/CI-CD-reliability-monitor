name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Dogfood: Echo monitors its own tests. Skips cleanly when the
      # FLAKYGUARD_API_KEY secret is unset (fork PRs, first runs).
      - name: Upload results to Echo
        if: always()
        continue-on-error: true
        uses: ./action
        with:
          report-path: junit.xml
          api-url: ${{ vars.FLAKYGUARD_API_URL }}
          api-key: ${{ secrets.FLAKYGUARD_API_KEY }}

  dashboard:
    name: Dashboard — typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
